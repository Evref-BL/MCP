# The documentation paths ignored here are covered by ci-docs.yml, which
# reports the same contexts so a documentation-only pull request can merge.
name: CI

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - docs/**
      - LICENSE
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - docs/**
      - LICENSE

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        smalltalk: [ Pharo64-12, Pharo64-13, Pharo64-14, Pharo64-15 ]
    name: ${{ matrix.smalltalk }}
    steps:
      - uses: actions/checkout@v6
      - uses: hpi-swa/setup-smalltalkCI@v1
        with:
          smalltalk-image: ${{ matrix.smalltalk }}
      - run: smalltalkci -s ${{ matrix.smalltalk }}
        shell: bash
        timeout-minutes: 15
      - name: Verify coverage report
        if: ${{ success() && matrix.smalltalk == 'Pharo64-14' }}
        run: test -s ./coverage/lcov.info
        shell: bash
      - name: Coveralls
        if: ${{ success() && matrix.smalltalk == 'Pharo64-14' }}
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: ./coverage/lcov.info
          format: lcov
          flag-name: Pharo64-14
          fail-on-error: false
