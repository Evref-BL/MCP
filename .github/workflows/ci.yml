# Every push and pull request runs the matrix, so each Pharo context the
# default branch requires reports once. A change that touches only paths
# without Pharo code skips the image steps, and the context reports success.
name: CI

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        smalltalk: [ Pharo64-10, Pharo64-11, Pharo64-12, Pharo64-13, Pharo64-14, Pharo64-15 ]
    name: ${{ matrix.smalltalk }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Tell whether Pharo code changed
        id: changes
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo 'pharo=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE" "$GITHUB_SHA")
          pharo=$(grep -vE '\.md$|^(docs|bin|node|test|templates)/|^(LICENSE|package\.json|\.github/workflows/(npm|publish-npm)\.yml)$' <<< "$changed" || true)
          if [ -n "$pharo" ]; then echo 'pharo=true'; else echo 'pharo=false'; fi >> "$GITHUB_OUTPUT"
      - uses: hpi-swa/setup-smalltalkCI@v1
        if: ${{ steps.changes.outputs.pharo == 'true' }}
        with:
          smalltalk-image: ${{ matrix.smalltalk }}
      - run: smalltalkci -s ${{ matrix.smalltalk }}
        if: ${{ steps.changes.outputs.pharo == 'true' }}
        shell: bash
        timeout-minutes: 15
      - name: Verify coverage report
        if: ${{ success() && steps.changes.outputs.pharo == 'true' && matrix.smalltalk == 'Pharo64-14' }}
        run: test -s ./coverage/lcov.info
        shell: bash
      - name: Coveralls
        if: ${{ success() && steps.changes.outputs.pharo == 'true' && matrix.smalltalk == 'Pharo64-14' }}
        uses: coverallsapp/github-action@v2
        with:
          file: ./coverage/lcov.info
          format: lcov
          flag-name: Pharo64-14
          fail-on-error: false
