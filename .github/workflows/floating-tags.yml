name: Floating tags

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  move:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          fetch-tags: true
      - run: bash .github/scripts/move-floating-tags.sh "$RELEASE"
        env:
          RELEASE: ${{ github.event.release.tag_name }}
