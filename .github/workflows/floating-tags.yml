name: Floating tags

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  move:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          fetch-tags: true
          # The app's token pushes the tags, not the workflow's.
          persist-credentials: false
      - run: bash .github/scripts/check-release-version.sh "$RELEASE"
        env:
          RELEASE: ${{ github.event.release.tag_name }}
      # Tags are moved by the automation app, as every release is made.
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.DEVNEXUS_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.DEVNEXUS_AUTOMATION_PRIVATE_KEY }}
      - run: |
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          bash .github/scripts/move-floating-tags.sh "$RELEASE"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE: ${{ github.event.release.tag_name }}
