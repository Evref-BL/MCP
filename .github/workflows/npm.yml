name: npm

on:
  push:
    branches: [main, develop]
    paths:
      - .github/workflows/npm.yml
      - bin/**
      - package.json
      - node/**
      - templates/**
      - test/**
  pull_request:
    branches: [main, develop]
    paths:
      - .github/workflows/npm.yml
      - bin/**
      - package.json
      - node/**
      - templates/**
      - test/**

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm test
      - run: npm pack --dry-run
